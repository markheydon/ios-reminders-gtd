<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Where an action lives</title>
  <desc id="desc">A project reminder holds the outcome and later steps in notes. Current actions are tagged subtasks. One-step work lives in Next. Context smart lists read both.</desc>
  <style>
    text { font-family: "DejaVu Sans", "Liberation Sans", Helvetica, Arial, sans-serif; fill: #1c1917; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 14px; }
    .m { font-size: 13px; fill: #44403c; }
  </style>
  <rect width="880" height="420" fill="#fafaf9"/>

  <rect x="32" y="28" width="500" height="364" rx="14" fill="#eef2ff" stroke="#4338ca"/>
  <text class="h" x="52" y="58">Projects list, Money section</text>

  <rect x="52" y="76" width="460" height="292" rx="12" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="h" x="72" y="108">Tax return filed</text>
  <text class="m" x="72" y="130">No tag on the parent. Tick it when the outcome is true.</text>

  <text class="b" x="72" y="164" font-weight="600">Notes</text>
  <text class="m" x="72" y="186">Done: submitted, receipt saved.</text>
  <text class="m" x="72" y="206">Later: pay anything owed.</text>

  <text class="b" x="72" y="244" font-weight="600">Subtasks you could do now</text>
  <rect x="72" y="258" width="420" height="36" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text class="b" x="86" y="281">Gather the interest statements</text>
  <text class="b" x="372" y="281" font-weight="700">#anywhere</text>

  <rect x="72" y="304" width="420" height="36" rx="8" fill="#f3e8ff" stroke="#6d28d9"/>
  <text class="b" x="86" y="327">Call the accountant with the list</text>
  <text class="b" x="400" y="327" font-weight="700">#call</text>

  <rect x="556" y="76" width="292" height="120" rx="14" fill="#ccfbf1" stroke="#0f766e"/>
  <text class="h" x="576" y="108">Next</text>
  <text class="m" x="576" y="136">Call dentist and book a checkup</text>
  <text class="b" x="576" y="166" font-weight="700">#call</text>

  <rect x="556" y="220" width="292" height="148" rx="14" fill="#f5f5f4" stroke="#57534e"/>
  <text class="h" x="576" y="252">What the smart list shows</text>
  <text class="m" x="576" y="280">Calls includes both of the</text>
  <text class="m" x="576" y="300">#call items: the project subtask</text>
  <text class="m" x="576" y="320">and the one-step reminder.</text>
  <text class="m" x="576" y="348">Anywhere shows the statements.</text>
</svg>
