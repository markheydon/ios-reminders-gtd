name: Hugo validate

# Standalone build (not workflow_call) so PRs validate before hugo-build.yml is on main.

on:
  pull_request:
    paths:
      - "guide/**"
      - "website/**"
      - "scripts/invoke-hugo-site.sh"
      - "scripts/Invoke-HugoSite.ps1"
      - ".github/workflows/hugo-build.yml"
      - ".github/workflows/hugo-validate.yml"

permissions:
  contents: read

jobs:
  hugo-validate:
    name: Hugo validate
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.101.0
      GO_VERSION: 1.25.0
      HUGO_VERSION: 0.164.0
      TZ: Europe/London
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Create a local tools directory
        run: mkdir -p "${HOME}/.local"

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION} (extended)..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Configure Git
        run: git config --global core.quotepath false

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build
        working-directory: website
        run: |
          hugo mod get
          hugo build --gc --minify --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Verify published routes
        working-directory: website
        run: |
          test -f public/index.html
          test -f public/why/index.html
          test -f public/setup/index.html
          test -f public/capture-and-clarify/index.html
          test -f public/limits/index.html

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
