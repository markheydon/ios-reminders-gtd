name: Guide check

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'book/**'
      - 'scripts/check-guide.py'
      - '.github/workflows/guide-check.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'book/**'
      - 'scripts/check-guide.py'
      - '.github/workflows/guide-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run guide checks
        run: python3 scripts/check-guide.py
