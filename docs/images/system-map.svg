<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="title desc">
  <title id="title">From capture to context smart lists</title>
  <desc id="desc">Inbox is clarified into Someday, a project with tagged subtasks, or Next. Context tags gather onto Anywhere, Home, Out, Calls, and Waiting.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c1917; }
    .small { font-size: 13px; fill: #44403c; }
    .label { font-size: 15px; font-weight: 650; }
    .hint { font-size: 12px; fill: #57534e; }
  </style>
  <rect width="880" height="560" fill="#fafaf9"/>

  <rect x="40" y="36" width="140" height="52" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text class="label" x="110" y="67" text-anchor="middle">Inbox</text>

  <rect x="280" y="36" width="160" height="52" rx="10" fill="#e0e7ff" stroke="#3730a3"/>
  <text class="label" x="360" y="67" text-anchor="middle">Clarify</text>

  <line x1="180" y1="62" x2="280" y2="62" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="280,62 270,57 270,67" fill="#a8a29e"/>

  <rect x="560" y="28" width="280" height="68" rx="10" fill="#f5f5f4" stroke="#a8a29e"/>
  <text class="label" x="700" y="54" text-anchor="middle">Someday</text>
  <text class="hint" x="700" y="76" text-anchor="middle">Not committed. No context tag.</text>
  <line x1="440" y1="52" x2="560" y2="52" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="560,52 550,47 550,57" fill="#a8a29e"/>

  <rect x="80" y="160" width="520" height="210" rx="12" fill="#eef2ff" stroke="#4338ca"/>
  <text class="label" x="110" y="190">Project in an area section</text>
  <text class="hint" x="110" y="210">Title is the outcome. Parent has no context tag.</text>

  <rect x="110" y="230" width="460" height="36" rx="8" fill="#ffffff" stroke="#4338ca"/>
  <text class="small" x="126" y="253">Email the accountant the questions</text>
  <text class="small" x="470" y="253" font-weight="650">#anywhere</text>

  <rect x="110" y="276" width="460" height="36" rx="8" fill="#ffffff" stroke="#4338ca"/>
  <text class="small" x="126" y="299">Priya: photos of the damp patch</text>
  <text class="small" x="490" y="299" font-weight="650">#waiting</text>

  <rect x="110" y="322" width="460" height="32" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="hint" x="126" y="343">Notes hold later steps that are not actions yet.</text>

  <line x1="360" y1="88" x2="300" y2="160" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="300,160 304,148 312,156" fill="#a8a29e"/>

  <rect x="640" y="180" width="200" height="72" rx="10" fill="#ccfbf1" stroke="#0f766e"/>
  <text class="label" x="740" y="210" text-anchor="middle">Next</text>
  <text class="hint" x="740" y="232" text-anchor="middle">One step, one context tag.</text>
  <line x1="400" y1="88" x2="700" y2="180" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="700,180 688,174 694,166" fill="#a8a29e"/>

  <text class="label" x="40" y="430">Smart lists you open</text>
  <g font-size="14" font-weight="650">
    <rect x="40" y="448" width="140" height="40" rx="20" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="110" y="473" text-anchor="middle">Anywhere</text>
    <rect x="196" y="448" width="110" height="40" rx="20" fill="#dcfce7" stroke="#166534"/>
    <text x="251" y="473" text-anchor="middle">Home</text>
    <rect x="322" y="448" width="100" height="40" rx="20" fill="#ffedd5" stroke="#c2410c"/>
    <text x="372" y="473" text-anchor="middle">Out</text>
    <rect x="438" y="448" width="110" height="40" rx="20" fill="#f3e8ff" stroke="#6d28d9"/>
    <text x="493" y="473" text-anchor="middle">Calls</text>
    <rect x="564" y="448" width="130" height="40" rx="20" fill="#f5f5f4" stroke="#57534e"/>
    <text x="629" y="473" text-anchor="middle">Waiting</text>
  </g>
  <text class="hint" x="40" y="520">Each list keeps actions from Projects and Next that carry that one tag. The project title stays visible above its subtasks.</text>
  <line x1="340" y1="370" x2="340" y2="448" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="340,448 335,438 345,438" fill="#a8a29e"/>
</svg>
